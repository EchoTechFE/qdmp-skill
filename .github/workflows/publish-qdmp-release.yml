name: Publish QDMP Skill

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the release version and marketplace source
        run: |
          version=$(node -p "require('./skills/qdmp-skill/references/skill-release.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          git diff --exit-code HEAD "origin/$DEFAULT_BRANCH" -- skills .codex-plugin .claude-plugin .qoder-plugin
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - run: node --test
      - run: node scripts/check-telemetry-distribution.mjs
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the stable Release with the bundled notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "QDMP Skill $GITHUB_REF_NAME" \
            --notes-file skills/qdmp-skill/references/release-notes.md
