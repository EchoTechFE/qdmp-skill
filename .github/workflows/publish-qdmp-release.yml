name: Publish QDMP Skill

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    name: QDMP release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all Skill and plugin versions
        run: node scripts/check-release-version.mjs
      - name: Verify the actual release tag and marketplace source
        if: github.event_name == 'push'
        run: |
          node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          git diff --exit-code HEAD "origin/$DEFAULT_BRANCH" -- skills .codex-plugin .claude-plugin .qoder-plugin
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - run: node --test
      - run: node scripts/check-telemetry-distribution.mjs
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the stable Release with the bundled notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "QDMP Skill $GITHUB_REF_NAME" \
            --notes-file skills/qdmp-skill/references/release-notes.md
